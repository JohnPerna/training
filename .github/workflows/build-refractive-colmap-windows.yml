name: Build Refractive COLMAP Windows

on:
  push:
    branches: [mp3d-refractive-colmap-build]
  workflow_dispatch:

concurrency:
  group: refractive-colmap-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VCPKG_DISABLE_METRICS: 1
      VCPKG_BINARY_SOURCES: "clear"
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      COLMAP_UNDERWATER_COMMIT: "5b73ae1a61856c4e712908a353c951a1ba2bc748"
      VCPKG_BASELINE_COMMIT: "4c1734ba2a969b1e6daa0ac79bc46ead7324df90"
      VCPKG_CACHE_KEY: "refractive-colmap-vcpkg-win64-4c1734ba-deps-v2"

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Expose runner 7-Zip to pinned vcpkg
        shell: pwsh
        run: |
          $sevenZipDir = "C:\Program Files\7-Zip"
          $sevenZipExe = Join-Path $sevenZipDir "7z.exe"
          if (-not (Test-Path $sevenZipExe)) {
            throw "GitHub Windows runner no longer provides $sevenZipExe"
          }
          $sevenZipDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $sevenZipExe | Select-Object -First 4
          Write-Host "Pinned vcpkg will use runner-provided 7-Zip instead of dead historical tool-download URLs."

      - name: Install current MinGW build tools and preflight compatibility
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          $mingwBin = "C:\msys64\mingw64\bin"
          if (-not (Test-Path $bash)) {
            throw "GitHub Windows runner no longer provides MSYS2 at $bash"
          }

          # The pinned 2023 vcpkg snapshot references MSYS2 package revisions
          # that have since been removed from the mirrors. Install the current
          # equivalents from the runner's maintained MSYS2 installation.
          & $bash -lc "pacman -Sy --needed --noconfirm mingw-w64-x86_64-pkgconf mingw-w64-x86_64-gcc-fortran"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install current MSYS2 MinGW pkgconf/gfortran."
          }

          $pkgConfig = Join-Path $mingwBin "pkg-config.exe"
          $gfortran = Join-Path $mingwBin "gfortran.exe"
          foreach ($tool in @($pkgConfig, $gfortran)) {
            if (-not (Test-Path $tool)) { throw "Expected MinGW tool is missing: $tool" }
          }

          # Make native MinGW tools visible to vcpkg's CMake compiler discovery.
          $env:PATH = "$mingwBin;$env:PATH"
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $pkgConfig --version
          if ($LASTEXITCODE -ne 0) { throw "Native MinGW pkg-config failed its version check." }
          & $gfortran --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "Native MinGW gfortran failed its version check." }

          # Prove pkg-config accepts the exact native Windows semicolon path
          # convention used by vcpkg_fixup_pkgconfig.
          $probe1 = Join-Path $pwd "pkgconf_probe_empty"
          $probe2 = Join-Path $pwd "pkgconf_probe_hit"
          New-Item -ItemType Directory -Force $probe1, $probe2 | Out-Null
          @(
            'prefix=C:/mp3d-probe',
            'Name: mp3d-pkgconf-probe',
            'Description: vcpkg Windows path semantics probe',
            'Version: 1.0',
            'Libs:',
            'Cflags:'
          ) | Set-Content (Join-Path $probe2 "mp3d-pkgconf-probe.pc")
          $oldPkgPath = $env:PKG_CONFIG_PATH
          $env:PKG_CONFIG_PATH = "$probe1;$probe2"
          & $pkgConfig --exists mp3d-pkgconf-probe
          $pkgProbeCode = $LASTEXITCODE
          $env:PKG_CONFIG_PATH = $oldPkgPath
          Remove-Item -Recurse -Force $probe1, $probe2
          if ($pkgProbeCode -ne 0) {
            throw "Native MinGW pkg-config cannot resolve vcpkg-style Windows semicolon PKG_CONFIG_PATH."
          }

          # Prove the current gfortran can compile, link, and execute a native
          # x64 Windows program before vcpkg reaches LAPACK/SuiteSparse.
          $fortranSource = Join-Path $pwd "gfortran_probe.f90"
          $fortranExe = Join-Path $pwd "gfortran_probe.exe"
          @(
            'program mp3d_probe',
            '  print *, "MP3D_GFORTRAN_OK"',
            'end program mp3d_probe'
          ) | Set-Content $fortranSource
          & $gfortran -m64 $fortranSource -o $fortranExe
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $fortranExe)) {
            throw "Native MinGW gfortran failed the compile/link preflight."
          }
          $fortranOutput = & $fortranExe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $fortranOutput -notmatch 'MP3D_GFORTRAN_OK') {
            throw "Native MinGW gfortran-built executable failed its runtime preflight."
          }
          Remove-Item -Force $fortranSource, $fortranExe
          Write-Host "Verified native MinGW pkg-config and gfortran for pinned vcpkg."

      - name: Fetch pinned COLMAP Underwater source
        shell: pwsh
        run: |
          git init colmap_underwater
          git -C colmap_underwater remote add origin https://github.com/MDSKiel/colmap_underwater.git
          git -C colmap_underwater fetch --depth 1 origin $env:COLMAP_UNDERWATER_COMMIT
          git -C colmap_underwater checkout --detach FETCH_HEAD
          git -C colmap_underwater rev-parse HEAD | Tee-Object -FilePath UPSTREAM_COMMIT.txt

      - name: Patch legacy Glew package name for modern Windows CMake
        shell: pwsh
        run: |
          $path = "colmap_underwater/cmake/FindDependencies.cmake"
          $text = Get-Content $path -Raw
          $old = 'find_package(Glew ${COLMAP_FIND_TYPE})'
          $new = 'find_package(GLEW ${COLMAP_FIND_TYPE})'
          if (-not $text.Contains($old)) {
            throw "Expected legacy Glew find_package line not found; upstream changed, refusing blind patch."
          }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -NoNewline
          Write-Host "Patched legacy find_package(Glew) to CMake/vcpkg-compatible find_package(GLEW)."

      - name: Fetch upstream-pinned vcpkg baseline
        shell: pwsh
        run: |
          git init vcpkg
          git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C vcpkg fetch --depth 1 origin $env:VCPKG_BASELINE_COMMIT
          git -C vcpkg checkout --detach FETCH_HEAD
          git -C vcpkg rev-parse HEAD | Tee-Object -FilePath VCPKG_COMMIT.txt

          # The historical helper downloads a removed 2023 MSYS2 pkgconf build.
          # Keep the pinned package definitions but force it to use the current,
          # already-preflighted native MinGW pkg-config executable instead.
          $pkgHelper = "vcpkg/scripts/cmake/vcpkg_find_acquire_program(PKGCONFIG).cmake"
          $pkgText = Get-Content $pkgHelper -Raw
          $pkgOld = "set(program_name pkg-config)`nif(DEFINED ENV{PKG_CONFIG})"
          $pkgNewLines = @(
            'set(program_name pkg-config)',
            'if(CMAKE_HOST_WIN32 AND EXISTS "C:/msys64/mingw64/bin/pkg-config.exe")',
            '    set(PKGCONFIG "C:/msys64/mingw64/bin/pkg-config.exe" CACHE INTERNAL "" FORCE)',
            '    set(PKGCONFIG "${PKGCONFIG}" PARENT_SCOPE)',
            '    return()',
            'endif()',
            'if(DEFINED ENV{PKG_CONFIG})'
          )
          $pkgNew = $pkgNewLines -join "`n"
          if (-not $pkgText.Contains($pkgOld)) {
            throw "Expected legacy pkg-config helper prologue not found; refusing blind patch."
          }
          $pkgText = $pkgText.Replace($pkgOld, $pkgNew)
          Set-Content -Path $pkgHelper -Value $pkgText -NoNewline
          Write-Host "Patched legacy vcpkg helper to use current native MinGW pkg-config."

          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore pinned dependency tree
        id: restore-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: vcpkg/installed
          key: ${{ env.VCPKG_CACHE_KEY }}

      - name: Install pinned CPU headless dependencies
        shell: pwsh
        run: |
          .\vcpkg\vcpkg.exe install `
            boost-algorithm `
            boost-filesystem `
            boost-graph `
            boost-heap `
            boost-program-options `
            boost-property-map `
            boost-property-tree `
            boost-regex `
            boost-system `
            eigen3 `
            freeimage `
            flann `
            lz4 `
            metis `
            gflags `
            glog `
            sqlite3 `
            glew `
            "ceres[lapack,suitesparse]" `
            --triplet x64-windows `
            --clean-after-build

      - name: Save pinned dependency tree
        if: steps.restore-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg/installed
          key: ${{ env.VCPKG_CACHE_KEY }}

      - name: Configure underwater fork against pinned vcpkg baseline
        shell: pwsh
        run: |
          cmake -S colmap_underwater -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$pwd/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCUDA_ENABLED=OFF `
            -DGUI_ENABLED=OFF `
            -DOPENGL_ENABLED=OFF `
            -DCGAL_ENABLED=OFF `
            -DIPO_ENABLED=OFF `
            -DTESTS_ENABLED=OFF

      - name: Build underwater COLMAP executable
        shell: pwsh
        run: |
          $log = "build-output.txt"
          cmake --build build --config Release --target colmap_main --parallel 2 -- /verbosity:minimal 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $patterns = 'error C\d+|fatal error|CMake Error|MSB\d+|FAILED:|error:'
            Select-String -Path $log -Pattern $patterns |
              ForEach-Object { $_.Line } |
              Select-Object -First 300 |
              Set-Content build-errors.txt
            if (-not (Test-Path build-errors.txt) -or (Get-Item build-errors.txt).Length -eq 0) {
              "Build failed with exit code $code, but no standard compiler-error pattern matched. See build-output.txt." | Set-Content build-errors.txt
            }
            Write-Host "===== compact build errors ====="
            Get-Content build-errors.txt
            exit $code
          }

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refractive-colmap-build-errors
          path: |
            build-errors.txt
            build-output.txt
            UPSTREAM_COMMIT.txt
            VCPKG_COMMIT.txt
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 7

      - name: Locate executable and assemble portable runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe = Get-ChildItem -Path build -Recurse -Filter colmap.exe | Select-Object -First 1
          if (-not $exe) { throw "Could not locate built colmap.exe" }
          Copy-Item $exe.FullName artifact\colmap.exe
          if (Test-Path vcpkg\installed\x64-windows\bin) {
            Copy-Item vcpkg\installed\x64-windows\bin\*.dll artifact\ -ErrorAction SilentlyContinue
          }
          # LAPACK may have been built with the runner's external MinGW
          # gfortran. Include its runtime DLLs if they are present.
          foreach ($dll in @('libgfortran-5.dll','libquadmath-0.dll','libwinpthread-1.dll','libgcc_s_seh-1.dll')) {
            $src = Join-Path 'C:\msys64\mingw64\bin' $dll
            if (Test-Path $src) { Copy-Item $src artifact\ }
          }
          Copy-Item UPSTREAM_COMMIT.txt artifact\UPSTREAM_COMMIT.txt
          Copy-Item VCPKG_COMMIT.txt artifact\VCPKG_COMMIT.txt
          @"
          CPU-only, GUI-free Windows build of MDSKiel/colmap_underwater.
          Source is pinned to the commit in UPSTREAM_COMMIT.txt.
          Dependency package definitions are pinned to the upstream project's own
          Windows vcpkg baseline in VCPKG_COMMIT.txt. Qt, CUDA, CGAL, GUI, OpenGL,
          and tests are intentionally excluded for the MP3D calibration use case.
          Run VERIFY_REFRACTIVE_BUILD.cmd before use.
          "@ | Set-Content artifact\README_BUILD.txt
          @"
          @echo off
          setlocal
          cd /d "%~dp0"
          colmap.exe -h > colmap_help.txt 2>&1
          if errorlevel 1 exit /b 1
          colmap.exe feature_extractor -h > feature_extractor_help.txt 2>&1
          findstr /i /c:"camera_refrac_model" feature_extractor_help.txt >nul
          if errorlevel 1 (
            echo ERROR: feature_extractor help does not expose camera_refrac_model.
            exit /b 2
          )
          echo VERIFIED: Refractive COLMAP camera options are present.
          "@ | Set-Content artifact\VERIFY_REFRACTIVE_BUILD.cmd

      - name: Smoke-test built executable
        shell: pwsh
        run: |
          Push-Location artifact
          .\colmap.exe -h
          .\colmap.exe feature_extractor -h | Tee-Object -FilePath feature_extractor_help_ci.txt
          $help = Get-Content feature_extractor_help_ci.txt -Raw
          if ($help -notmatch '(?i)camera_refrac_model') {
            throw "Built executable does not expose ImageReader.camera_refrac_model; refusing to publish artifact."
          }
          Pop-Location

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: refractive-colmap-windows-x64-cpu
          path: artifact/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
