name: Build Refractive COLMAP Windows

on:
  push:
    branches: [mp3d-refractive-colmap-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VCPKG_DISABLE_METRICS: 1
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Export GitHub Actions cache variables for vcpkg
        shell: pwsh
        run: |
          "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $env:GITHUB_ENV
          "ACTIONS_CACHE_URL=$env:ACTIONS_CACHE_URL" >> $env:GITHUB_ENV
          "ACTIONS_RUNTIME_TOKEN=$env:ACTIONS_RUNTIME_TOKEN" >> $env:GITHUB_ENV

      - name: Clone COLMAP Underwater source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/the-sauer/colmap_underwater.git colmap_underwater
          Push-Location colmap_underwater
          git rev-parse HEAD | Tee-Object -FilePath ../UPSTREAM_COMMIT.txt
          Pop-Location

      - name: Patch legacy Glew package name for modern Windows CMake
        shell: pwsh
        run: |
          $path = "colmap_underwater/cmake/FindDependencies.cmake"
          $text = Get-Content $path -Raw
          $old = 'find_package(Glew ${COLMAP_FIND_TYPE})'
          $new = 'find_package(GLEW ${COLMAP_FIND_TYPE})'
          if (-not $text.Contains($old)) {
            throw "Expected legacy Glew find_package line not found; upstream changed, refusing blind patch."
          }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -NoNewline
          Write-Host "Patched legacy find_package(Glew) to CMake/vcpkg-compatible find_package(GLEW)."
          Select-String -Path $path -Pattern 'find_package\(GLEW'

      - name: Clone and bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install only CPU headless dependencies
        shell: pwsh
        run: |
          # Do NOT install the vcpkg COLMAP port here. Its default GUI feature
          # pulls Qt, which we neither need nor want for this calibration build.
          .\vcpkg\vcpkg.exe install `
            boost-filesystem `
            boost-graph `
            boost-program-options `
            boost-system `
            eigen3 `
            freeimage `
            flann `
            lz4 `
            metis `
            glog `
            sqlite3 `
            glew `
            "ceres[lapack,suitesparse]" `
            --triplet x64-windows `
            --clean-after-build

      - name: Configure underwater fork against minimal vcpkg dependencies
        shell: pwsh
        run: |
          cmake -S colmap_underwater -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$pwd/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCUDA_ENABLED=OFF `
            -DGUI_ENABLED=OFF `
            -DOPENGL_ENABLED=OFF `
            -DCGAL_ENABLED=OFF `
            -DIPO_ENABLED=OFF `
            -DTESTS_ENABLED=OFF

      - name: Build underwater COLMAP executable
        shell: pwsh
        run: |
          # The executable target is colmap_main; the target named colmap is an
          # interface library in this older fork.
          cmake --build build --config Release --target colmap_main --parallel 2

      - name: Locate executable and assemble portable runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe = Get-ChildItem -Path build -Recurse -Filter colmap.exe | Select-Object -First 1
          if (-not $exe) { throw "Could not locate built colmap.exe" }
          Copy-Item $exe.FullName artifact\colmap.exe
          if (Test-Path vcpkg\installed\x64-windows\bin) {
            Copy-Item vcpkg\installed\x64-windows\bin\*.dll artifact\ -ErrorAction SilentlyContinue
          }
          Copy-Item UPSTREAM_COMMIT.txt artifact\UPSTREAM_COMMIT.txt
          @"
          This is a CPU-only, GUI-free Windows build of the-sauer/colmap_underwater.
          Built on GitHub Actions windows-2022 with only the dependencies needed
          by this older Refractive COLMAP fork. Qt, CUDA, CGAL, GUI, and OpenGL
          support are intentionally excluded.
          The upstream commit is recorded in UPSTREAM_COMMIT.txt.
          Run VERIFY_REFRACTIVE_BUILD.cmd before use.
          "@ | Set-Content artifact\README_BUILD.txt
          @"
          @echo off
          setlocal
          cd /d "%~dp0"
          colmap.exe -h > colmap_help.txt 2>&1
          if errorlevel 1 exit /b 1
          colmap.exe feature_extractor -h > feature_extractor_help.txt 2>&1
          findstr /i /c:"camera_refrac_model" feature_extractor_help.txt >nul
          if errorlevel 1 (
            echo ERROR: feature_extractor help does not expose camera_refrac_model.
            exit /b 2
          )
          echo VERIFIED: Refractive COLMAP camera options are present.
          "@ | Set-Content artifact\VERIFY_REFRACTIVE_BUILD.cmd

      - name: Smoke-test built executable
        shell: pwsh
        run: |
          Push-Location artifact
          .\colmap.exe -h
          .\colmap.exe feature_extractor -h | Tee-Object -FilePath feature_extractor_help_ci.txt
          $help = Get-Content feature_extractor_help_ci.txt -Raw
          if ($help -notmatch '(?i)camera_refrac_model') {
            throw "Built executable does not expose ImageReader.camera_refrac_model; refusing to publish artifact."
          }
          Pop-Location

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: refractive-colmap-windows-x64-cpu
          path: artifact/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
